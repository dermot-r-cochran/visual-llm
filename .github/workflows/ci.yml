name: CI

# Runs the suite on every pull request and push to main. The suite is pure
# Python with zero runtime dependencies and no model calls (see
# TestingStrategy.md), so this workflow is as small as CI gets - and the 92
# tests it enforces were previously voluntary.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the package declares (3.9) and current stable - the two
        # ends catch what a middle version rarely adds.
        python-version: ["3.9", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # --cov-fail-under is a ratchet at the measured baseline (86% on
        # 2026-08-24): raise it in the change that adds the tests that earn
        # it; it can never quietly fall.
        run: pytest --cov=hidl --cov-fail-under=86

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: ruff check
        run: ruff check .

  docs:
    # Standard library only, so nothing is installed. Fails on a README test
    # citation that names no test, a broken relative link, a second
    # front-matter block, and a README count or table that disagrees with
    # the code. Added 2026-10-10 with the README-proof convention; see
    # TestingStrategy.md.
    name: docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Doc check
        run: python .github/scripts/check_docs.py
